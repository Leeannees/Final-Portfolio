<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio | Resume</title>
    <meta name="description" content="Resume page with embedded PDF." />
    <link rel="stylesheet" href="./css/styles.css" />

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">◆</span>
          <span class="brand-name">LeeAnne English-Stewart</span>

        <nav class="nav" aria-label="Primary">
          <a class="nav-link" href="./index.html">Home</a>

      <div class="page-head">

        <p class="page-subtitle">

        </p>
        <div class="page-actions">
          <a class="btn" href="./assets/resume.pdf" download>Download PDF</a>

    <footer class="site-footer">

        <p class="footer-text">
          © <span id="year"></span> LeeAnne English-Stewart. All rights reserved.
